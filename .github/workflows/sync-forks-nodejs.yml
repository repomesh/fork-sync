name: Sync All Forked Repos (Node.js)

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Changed from read to write
      issues: write
      pull-requests: write  # Added for potential PR operations
    
    
    outputs:
      sync-summary: ${{ steps.sync.outputs.summary }}
      total-repos: ${{ steps.sync.outputs.total }}
      success-count: ${{ steps.sync.outputs.success }}
      failed-count: ${{ steps.sync.outputs.failed }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Debug token permissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DEBUG: Checking token permissions..."
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "Token starts with: ${GITHUB_TOKEN:0:10}..."
          
          # Check what permissions we have
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/user | jq -r '.login, .type'
          
          # Check organization membership
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/orgs/${{ github.repository_owner }}/members/${{ github.actor }}" \
               -w "HTTP Status: %{http_code}\n"
      
      - name: Sync forked repositories
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          node - << 'EOF'
          const https = require('https');
          const fs = require('fs');
          
          const org = process.env.ORG_NAME;
          const token = process.env.GITHUB_TOKEN;
          
          function makeGitHubRequest(path, method = 'GET', data = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path: path,
                method: method,
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'GitHub-Actions-Fork-Sync',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              
              if (data) {
                const jsonData = JSON.stringify(data);
                options.headers['Content-Type'] = 'application/json';
                options.headers['Content-Length'] = Buffer.byteLength(jsonData);
              }
              
              const req = https.request(options, (res) => {
                let responseData = '';
                
                res.on('data', (chunk) => {
                  responseData += chunk;
                });
                
                res.on('end', () => {
                  try {
                    const parsed = responseData ? JSON.parse(responseData) : {};
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      resolve(parsed);
                    } else {
                      reject(new Error(`HTTP ${res.statusCode}: ${parsed.message || responseData}`));
                    }
                  } catch (e) {
                    reject(new Error(`Failed to parse response: ${responseData}`));
                  }
                });
              });
              
              req.on('error', reject);
              
              if (data) {
                req.write(JSON.stringify(data));
              }
              
              req.end();
            });
          }
          
          async function getAllRepos(org) {
            try {
              let allRepos = [];
              let page = 1;
              const perPage = 100;
              
              while (true) {
                const repos = await makeGitHubRequest(`/orgs/${org}/repos?per_page=${perPage}&page=${page}&type=forks`);
                
                if (!repos || repos.length === 0) {
                  break;
                }
                
                // Filter for forked repositories and add parent info
                const forkedRepos = repos.filter(repo => repo.fork).map(repo => ({
                  name: repo.name,
                  nameWithOwner: repo.full_name,
                  isFork: repo.fork,
                  defaultBranch: repo.default_branch || 'main',
                  parent: repo.parent ? {
                    url: repo.parent.html_url,
                    full_name: repo.parent.full_name,
                    default_branch: repo.parent.default_branch || 'main'
                  } : null
                }));
                
                allRepos = allRepos.concat(forkedRepos);
                
                if (repos.length < perPage) {
                  break;
                }
                
                page++;
              }
              
              // FOR DEBUGGING: Return only the first repository
              console.log(`DEBUG: Found ${allRepos.length} total forked repos, testing with first one only`);
              return allRepos.slice(0, 1);
              
            } catch (error) {
              console.error('Error fetching repositories:', error.message);
              return [];
            }
          }
          
          async function syncRepo(repoFullName, branch = 'main') {
            try {
              // GitHub REST API endpoint for syncing a fork
              // POST /repos/{owner}/{repo}/merge-upstream
              const [owner, repo] = repoFullName.split('/');
              
              console.log(`DEBUG: Attempting to sync ${repoFullName} with branch ${branch}`);
              console.log(`DEBUG: Making POST request to /repos/${owner}/${repo}/merge-upstream`);
              
              const response = await makeGitHubRequest(`/repos/${owner}/${repo}/merge-upstream`, 'POST', {
                branch: branch
              });
              
              console.log(`DEBUG: Sync response:`, JSON.stringify(response, null, 2));
              
              return { success: true, message: 'Success' };
            } catch (error) {
              console.log(`DEBUG: Sync error for ${repoFullName}:`, error.message);
              
              let message = error.message;
              
              // Handle specific GitHub API error messages
              if (message.includes('409')) {
                message = 'Already up to date';
                return { success: true, message }; // Treat as success
              } else if (message.includes('422')) {
                message = 'Cannot sync - may have conflicts or custom commits';
              } else if (message.includes('403')) {
                message = 'Forbidden - insufficient permissions';
              } else if (message.includes('404')) {
                message = 'Repository not found or not a fork';
              }
              
              return { success: false, message };
            }
          }
          
          // Main logic

          async function main() {
            console.log('DEBUG: Starting fork sync process...');
            console.log(`DEBUG: Organization: ${org}`);
            console.log(`DEBUG: Token length: ${token ? token.length : 'undefined'}`);
            console.log(`DEBUG: Token starts with: ${token ? token.substring(0, 10) + '...' : 'undefined'}`);
            
            console.log('Fetching repositories...');
            const forkedRepos = await getAllRepos(org);
            
            console.log(`Found ${forkedRepos.length} forked repositories for testing\n`);
            
            if (forkedRepos.length === 0) {
              console.log('No forked repositories found to test');
              return;
            }
            
            // Print repo details for debugging
            forkedRepos.forEach(repo => {
              console.log(`DEBUG: Repo to test: ${repo.nameWithOwner} (parent: ${repo.parent?.full_name || 'Unknown'})`);
            });
            
            const results = [];
            let successCount = 0;
            let failedCount = 0;
            
            for (const repo of forkedRepos) {
              const repoName = repo.nameWithOwner;
              const parentUrl = repo.parent?.url || 'Unknown';
              const defaultBranch = repo.defaultBranch;
              
              console.log(`Syncing ${repoName} (default branch: ${defaultBranch})...`);
              
              const { success, message } = await syncRepo(repoName, defaultBranch);
              const status = success ? '✓' : '✗';
              
              console.log(`${status} ${repoName}${message !== 'Success' ? ` (${message})` : ''}`);
              
              if (success) {
                successCount++;
              } else {
                failedCount++;
              }
              
              results.push({
                repo: repoName,
                status: success ? 'success' : 'failed',
                message: message,
                parent: parentUrl,
                branch: defaultBranch
              });
            }
            
            // Output for GitHub Actions
            const summary = JSON.stringify(results);
            const outputFile = process.env.GITHUB_OUTPUT;
            
            fs.appendFileSync(outputFile, `summary=${summary}\n`);
            fs.appendFileSync(outputFile, `total=${forkedRepos.length}\n`);
            fs.appendFileSync(outputFile, `success=${successCount}\n`);
            fs.appendFileSync(outputFile, `failed=${failedCount}\n`);
            
            console.log(`\n✓ Successfully synced ${successCount}/${forkedRepos.length} repositories`);
          }
          
          main().catch(error => {
            console.error('Fatal error:', error);
            process.exit(1);
          });
          EOF
  
  post-status:
    needs: sync-forks
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Parse sync results
        id: parse
        run: |
          SUMMARY='${{ needs.sync-forks.outputs.sync-summary }}'
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
      
      - name: Create or update issue
        uses: actions/github-script@v7
        env:
          TOTAL: ${{ needs.sync-forks.outputs.total-repos }}
          SUCCESS: ${{ needs.sync-forks.outputs.success-count }}
          FAILED: ${{ needs.sync-forks.outputs.failed-count }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const total = process.env.TOTAL;
            const success = process.env.SUCCESS;
            const failed = process.env.FAILED;
            let summary = [];
            
            try {
              summary = JSON.parse(process.env.SUMMARY);
            } catch (e) {
              console.log('Could not parse summary');
            }
            
            const timestamp = new Date().toISOString();
            const successRate = total > 0 ? ((success / total) * 100).toFixed(1) : 0;
            
            let statusEmoji = '✅';
            if (failed > 0) statusEmoji = '⚠️';
            if (failed === total) statusEmoji = '❌';
            
            let body = `${statusEmoji} **Fork Sync Status Report**\n\n`;
            body += `**Timestamp:** ${timestamp}\n`;
            body += `**Trigger:** ${process.env.GITHUB_EVENT_NAME === 'schedule' ? 'Scheduled' : 'Manual'}\n\n`;
            
            body += `## Summary\n`;
            body += `| Metric | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| Total Repos | ${total} |\n`;
            body += `| Successful | ${success} |\n`;
            body += `| Failed | ${failed} |\n`;
            body += `| Success Rate | ${successRate}% |\n\n`;
            
            if (summary.length > 0) {
              body += `## Detailed Results\n`;
              
              const successful = summary.filter(r => r.status === 'success');
              const failed_repos = summary.filter(r => r.status === 'failed');
              
              if (successful.length > 0) {
                body += `### ✅ Successful (${successful.length})\n`;
                successful.forEach(r => {
                  body += `- **${r.repo}** (\`${r.branch}\`) → ${r.parent}\n`;
                });
                body += '\n';
              }
              
              if (failed_repos.length > 0) {
                body += `### ❌ Failed (${failed_repos.length})\n`;
                failed_repos.forEach(r => {
                  body += `- **${r.repo}** (\`${r.branch}\`) - ${r.message}\n`;
                });
              }
            }
            
            body += `\n---\n`;
            body += `[View Workflow Run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            
            // Find existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'fork-sync-status'
            });
            
            const existingIssue = issues.data.find(i => 
              i.title.includes('Fork Sync Status') && i.state === 'open'
            );
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fork Sync Status - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['fork-sync-status', 'automated']
              });
              console.log(`Created issue #${issue.data.number}`);
            }