name: Sync All Forked Repos (REST API)

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    outputs:
      sync-summary: ${{ steps.sync.outputs.summary }}
      total-repos: ${{ steps.sync.outputs.total }}
      success-count: ${{ steps.sync.outputs.success }}
      failed-count: ${{ steps.sync.outputs.failed }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Sync forked repositories
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          #!/bin/bash
          set -e
          
          # GitHub API headers
          AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github.v3+json"
          API_VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"
          USER_AGENT_HEADER="User-Agent: GitHub-Actions-Fork-Sync"
          
          echo "Fetching repositories using GitHub REST API..."
          
          # Function to get all forked repositories
          get_forked_repos() {
            local page=1
            local per_page=100
            local all_repos="[]"
            
            while true; do
              echo "Fetching page $page..."
              
              response=$(curl -s -w "%{http_code}" \
                -H "$AUTH_HEADER" \
                -H "$ACCEPT_HEADER" \
                -H "$API_VERSION_HEADER" \
                -H "$USER_AGENT_HEADER" \
                "https://api.github.com/orgs/$ORG_NAME/repos?per_page=$per_page&page=$page&type=forks")
              
              http_code="${response: -3}"
              body="${response%???}"
              
              if [ "$http_code" != "200" ]; then
                echo "Error fetching repositories: HTTP $http_code"
                echo "$body"
                break
              fi
              
              # Check if we got any repos
              repo_count=$(echo "$body" | jq length)
              if [ "$repo_count" -eq 0 ]; then
                break
              fi
              
              # Filter for forked repos and transform to our format
              page_repos=$(echo "$body" | jq '[.[] | select(.fork == true) | {
                name: .name,
                nameWithOwner: .full_name,
                isFork: .fork,
                parent: (if .parent then {url: .parent.html_url, full_name: .parent.full_name} else null end)
              }]')
              
              # Merge with existing repos
              all_repos=$(echo "$all_repos $page_repos" | jq -s 'add')
              
              # If we got less than per_page repos, we're done
              if [ "$repo_count" -lt "$per_page" ]; then
                break
              fi
              
              ((page++))
            done
            
            echo "$all_repos"
          }
          
          # Function to sync a single repository
          sync_repo() {
            local repo_full_name="$1"
            local branch="${2:-main}"
            
            # Extract owner and repo name
            local owner=$(echo "$repo_full_name" | cut -d'/' -f1)
            local repo=$(echo "$repo_full_name" | cut -d'/' -f2)
            
            # Make the sync request
            response=$(curl -s -w "%{http_code}" \
              -X POST \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$API_VERSION_HEADER" \
              -H "$USER_AGENT_HEADER" \
              -H "Content-Type: application/json" \
              -d "{\"branch\":\"$branch\"}" \
              "https://api.github.com/repos/$owner/$repo/merge-upstream")
            
            http_code="${response: -3}"
            body="${response%???}"
            
            case "$http_code" in
              200|201)
                echo "success|Success"
                ;;
              409)
                echo "success|Already up to date"
                ;;
              422)
                message=$(echo "$body" | jq -r '.message // "Cannot sync - may have conflicts or custom commits"')
                echo "failed|$message"
                ;;
              403)
                echo "failed|Forbidden - insufficient permissions"
                ;;
              404)
                echo "failed|Repository not found or not a fork"
                ;;
              *)
                message=$(echo "$body" | jq -r '.message // "Unknown error"')
                echo "failed|HTTP $http_code: $message"
                ;;
            esac
          }
          
          # Get all forked repositories
          forked_repos=$(get_forked_repos)
          total_repos=$(echo "$forked_repos" | jq length)
          
          echo "Found $total_repos forked repositories"
          echo ""
          
          # Initialize counters
          success_count=0
          failed_count=0
          results="[]"
          
          # Process each repository
          echo "$forked_repos" | jq -c '.[]' | while read -r repo; do
            repo_name=$(echo "$repo" | jq -r '.nameWithOwner')
            parent_url=$(echo "$repo" | jq -r '.parent.url // "Unknown"')
            
            echo "Syncing $repo_name..."
            
            # Sync the repository
            sync_result=$(sync_repo "$repo_name")
            status=$(echo "$sync_result" | cut -d'|' -f1)
            message=$(echo "$sync_result" | cut -d'|' -f2-)
            
            if [ "$status" = "success" ]; then
              echo "✓ $repo_name ($message)"
              ((success_count++))
            else
              echo "✗ $repo_name ($message)"
              ((failed_count++))
            fi
            
            # Build results JSON
            result=$(jq -n \
              --arg repo "$repo_name" \
              --arg status "$status" \
              --arg message "$message" \
              --arg parent "$parent_url" \
              '{repo: $repo, status: $status, message: $message, parent: $parent}')
            
            results=$(echo "$results" | jq ". += [$result]")
          done
          
          # Note: Due to subshell limitations in the while loop, we need to recalculate
          # the final counts and results outside the loop
          final_results="[]"
          final_success=0
          final_failed=0
          
          echo ""
          echo "Recalculating final results..."
          
          echo "$forked_repos" | jq -c '.[]' | while read -r repo; do
            repo_name=$(echo "$repo" | jq -r '.nameWithOwner')
            parent_url=$(echo "$repo" | jq -r '.parent.url // "Unknown"')
            
            sync_result=$(sync_repo "$repo_name")
            status=$(echo "$sync_result" | cut -d'|' -f1)
            message=$(echo "$sync_result" | cut -d'|' -f2-)
            
            if [ "$status" = "success" ]; then
              ((final_success++))
            else
              ((final_failed++))
            fi
            
            result=$(jq -n \
              --arg repo "$repo_name" \
              --arg status "$status" \
              --arg message "$message" \
              --arg parent "$parent_url" \
              '{repo: $repo, status: $status, message: $message, parent: $parent}')
            
            final_results=$(echo "$final_results" | jq ". += [$result]")
            
            # Store results in temporary files to persist across subshells
            echo "$final_results" > /tmp/sync_results.json
            echo "$final_success" > /tmp/success_count.txt
            echo "$final_failed" > /tmp/failed_count.txt
          done
          
          # Read final results from temporary files
          if [ -f "/tmp/sync_results.json" ]; then
            final_results=$(cat /tmp/sync_results.json)
            final_success=$(cat /tmp/success_count.txt)
            final_failed=$(cat /tmp/failed_count.txt)
          else
            final_results="[]"
            final_success=0
            final_failed=0
          fi
          
          # Output results
          echo "summary=$final_results" >> "$GITHUB_OUTPUT"
          echo "total=$total_repos" >> "$GITHUB_OUTPUT"
          echo "success=$final_success" >> "$GITHUB_OUTPUT"
          echo "failed=$final_failed" >> "$GITHUB_OUTPUT"
          
          echo ""
          echo "✓ Successfully synced $final_success/$total_repos repositories"
  
  post-status:
    needs: sync-forks
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Parse sync results
        id: parse
        run: |
          SUMMARY='${{ needs.sync-forks.outputs.sync-summary }}'
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
      
      - name: Create or update issue
        uses: actions/github-script@v7
        env:
          TOTAL: ${{ needs.sync-forks.outputs.total-repos }}
          SUCCESS: ${{ needs.sync-forks.outputs.success-count }}
          FAILED: ${{ needs.sync-forks.outputs.failed-count }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const total = process.env.TOTAL;
            const success = process.env.SUCCESS;
            const failed = process.env.FAILED;
            let summary = [];
            
            try {
              summary = JSON.parse(process.env.SUMMARY);
            } catch (e) {
              console.log('Could not parse summary');
            }
            
            const timestamp = new Date().toISOString();
            const successRate = total > 0 ? ((success / total) * 100).toFixed(1) : 0;
            
            let statusEmoji = '✅';
            if (failed > 0) statusEmoji = '⚠️';
            if (failed === total) statusEmoji = '❌';
            
            let body = `${statusEmoji} **Fork Sync Status Report**\n\n`;
            body += `**Timestamp:** ${timestamp}\n`;
            body += `**Trigger:** ${process.env.GITHUB_EVENT_NAME === 'schedule' ? 'Scheduled' : 'Manual'}\n\n`;
            
            body += `## Summary\n`;
            body += `| Metric | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| Total Repos | ${total} |\n`;
            body += `| Successful | ${success} |\n`;
            body += `| Failed | ${failed} |\n`;
            body += `| Success Rate | ${successRate}% |\n\n`;
            
            if (summary.length > 0) {
              body += `## Detailed Results\n`;
              
              const successful = summary.filter(r => r.status === 'success');
              const failed_repos = summary.filter(r => r.status === 'failed');
              
              if (successful.length > 0) {
                body += `### ✅ Successful (${successful.length})\n`;
                successful.forEach(r => {
                  body += `- **${r.repo}** → ${r.parent}\n`;
                });
                body += '\n';
              }
              
              if (failed_repos.length > 0) {
                body += `### ❌ Failed (${failed_repos.length})\n`;
                failed_repos.forEach(r => {
                  body += `- **${r.repo}** (${r.message})\n`;
                });
              }
            }
            
            body += `\n---\n`;
            body += `[View Workflow Run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            
            // Find existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'fork-sync-status'
            });
            
            const existingIssue = issues.data.find(i => 
              i.title.includes('Fork Sync Status') && i.state === 'open'
            );
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fork Sync Status - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['fork-sync-status', 'automated']
              });
              console.log(`Created issue #${issue.data.number}`);
            }